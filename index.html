<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My React App</title>

    <!-- 1. Load React and ReactDOM from CDNs -->
    <script src="https://unpkg.com" crossorigin></script>
    <script src="https://unpkg.com" crossorigin></script>

    <!-- 2. Load Babel to compile JSX directly in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <!-- The HTML container where your React app will render -->
    <div id="root"></div>

    <!-- 3. Link your standalone App.jsx file -->
    <script type="text/babel" src="App.jsx"></script>
</body>
</html>
