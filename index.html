<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Counter App</title>

    <!-- Reliable, High-Performance CDNs -->
    <script src="https://cloudflare.com" crossorigin="anonymous"></script>
    <script src="https://cloudflare.com" crossorigin="anonymous"></script>
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
</head>
<body>
    <div id="root"></div>

    <!-- Embedding your React code directly avoids file-loading CORS issues entirely -->
    <script type="text/babel">
        const { Component } = React;

        class Counter extends Component { 
            constructor(props) { 
                super(props); 
                this.state = { count: 0 }; 
                this.incrementCount = this.incrementCount.bind(this); 
            } 

            incrementCount() { 
                this.setState(prevState => ({ count: prevState.count + 1 })); 
            } 

            render() { 
                return (
                    <div style={{ textAlign: 'center', marginTop: '50px', fontFamily: 'sans-serif' }}> 
                        <h1>Counter App</h1> 
                        <p>Current Count: <strong>{this.state.count}</strong></p> 
                        <button 
                            onClick={this.incrementCount}
                            style={{ padding: '10px 20px', fontSize: '16px', cursor: 'pointer' }}
                        > 
                            Increment 
                        </button> 
                    </div> 
                ); 
            } 
        } 

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Counter />);
    </script>
</body>
</html>
